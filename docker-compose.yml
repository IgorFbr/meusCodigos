services:
  postgres:
    image: postgres:16-alpine
    container_name: dungeon-arena-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dungeon_arena
      POSTGRES_USER: dungeon_user
      POSTGRES_PASSWORD: dungeon_password
    ports:
      - "5432:5432"
    volumes:
      - dungeon_arena_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dungeon_user -d dungeon_arena"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dungeon_arena_data:
